[package]
name = "jev-calendar"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chrono = "0.4"
chrono-tz = "0.10"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
regex = "1"
rand = "0.9"
url = "2"
subtle = "2"
futures-util = "0.3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
